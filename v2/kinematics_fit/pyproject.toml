[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinematics-fit"
version = "0.1.0"
description = "2R arm kinematics: FK/IK and vision-fitted L1/L2/base/servo-offset calibration. Own copy of kinematics/motion, depends only on arm-hw-core plus reading homography_calib's output file."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "arm-hw-core",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
arm-kinfit = "kinematics_fit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
