[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teach"
version = "0.1.0"
description = "Hand-teach fallback mode for the 2R arm (no camera needed): release torque, hand-move the arm, mark named points. Own copy of kinematics/motion, depends only on arm-hw-core."
requires-python = ">=3.10"
dependencies = [
    "arm-hw-core",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
arm-teach = "teach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
